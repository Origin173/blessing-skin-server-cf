# Next.js (OpenNext) 项目配置 — 部署到 Cloudflare Workers (wrangler deploy .open-next/worker.js)
# 文档: https://opennext.js.org/cloudflare
name = "blessing-skin-next"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# ---------- 静态资源 (OpenNext 构建产物, 由 ASSETS 绑定服务) ----------

[assets]
directory = "./.open-next/assets"
binding = "ASSETS"

# ---------- 绑定 (与原 pages/ 同名,代码复用零改动) ----------

[[d1_databases]]
binding = "DB"
database_name = "blessingskin"
database_id = "58da267c-6d4c-4cb7-9225-c724de5e81ef"

[[r2_buckets]]
binding = "TEXTURES"
bucket_name = "blessingskin-textures"

[[kv_namespaces]]
binding = "KV_SKIN"
id = "ef4940bd1141494fb86c76a362d6f0d1"

# ---------- 非机密配置 ----------

[vars]
PWD_METHOD = "BCRYPT"

# ---------- 机密配置 (wrangler secret put / .dev.vars) ----------
# SALT / APP_KEY / PASSPORT_PRIVATE_KEY / PASSPORT_PUBLIC_KEY /
# RESEND_API_KEY / MAIL_FROM_ADDRESS / MAIL_FROM_NAME
